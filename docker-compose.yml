services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: documind-postgres

    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind

    ports:
      - "5432:5432"

    volumes:
      - documind_postgres_data:/var/lib/postgresql/data

volumes:
  documind_postgres_data: